spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

server:
  servlet:
    context-path: /api/v1
  error:
    include-message: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.financedashboard: INFO
    org.springframework.security: WARN